services:
  - type: web
    name: smart-career-backend
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn career_backend.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-career-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://smart-career-platform.vercel.app"
      - key: EMAIL_HOST_USER
        value: "patisaranya@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false

databases:
  - name: smart-career-db
    databaseName: career_platform
    user: career_user
    region: oregon
    plan: free
